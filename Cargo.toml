[package]
name = "factorio-mod-settings-converter"
version = "1.1.0"
edition = "2024"

[lib]
name = "factorio_mod_settings_converter"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "factorio-mod-settings-converter"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
anyhow = "1.0.102"
byteorder = "1.5.0"
clap = { version = "4.5.60", features = ["derive"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde_yml = "0.0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
